<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Portfolio</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/contact-me.css">
    <link rel="stylesheet" href="CSS/footer_section.css">
    <link rel="stylesheet" href="footer_section.html">
</head>

<body>
    <div id="header" ></div>

    <section id="contact" class="contact-section">
        <div class="container">
            <h1>Contact Me</h1>
            <p>If you have any questions or would like to collaborate, feel free to reach out!</p>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Your Full Name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Your Email Address">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required placeholder="Your Message"></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
            
        </div>
    </section>
        
    <div id="footer"></div>


    <script src="back.js"></script>

</body>

</html>
